[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-tools"
version = "0.1.0"
description = "Scripts and tools for working with PCB suppliers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jlcpcb-convert = "tools.jlcpcb.convert:main"

[tool.setuptools]
packages = ["tools", "tools.jlcpcb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools/jlcpcb/tests"]
